
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Security Scan</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: 'Orbitron', sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
}

.small {
    font-size: 18px;
    letter-spacing: 5px;
    opacity: .7;
    margin-bottom: 25px;
}

.title {
    font-size: clamp(42px, 8vw, 100px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 35px;
    text-shadow: 0 0 25px #ffffff55;
}

.status {
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 700;
    margin-bottom: 30px;
}

.percent {
    font-size: clamp(70px, 14vw, 160px);
    font-weight: 900;
    line-height: 1;
    margin-bottom: 40px;
    text-shadow: 0 0 35px #ffffff55;
}

.bar {
    width: min(850px, 90vw);
    height: 25px;
    border: 2px solid #ffffff88;
    padding: 4px;
}

.progress {
    height: 100%;
    width: 0%;
    background: white;
    transition: width .25s;
}

.warning {
    display: none;
    color: #ff3030;
    animation: pulse .7s infinite alternate;
}

.warning h1 {
    font-size: clamp(45px, 9vw, 110px);
    font-weight: 900;
    margin-bottom: 30px;
}

.warning p {
    font-size: clamp(20px, 3vw, 35px);
}

.prank {
    display: none;
}

.prank h1 {
    font-size: clamp(50px, 11vw, 150px);
    font-weight: 900;
    margin-bottom: 30px;
}

.prank p {
    font-size: clamp(22px, 4vw, 45px);
}

button {
    margin-top: 45px;
    padding: 18px 35px;
    border: 2px solid white;
    background: transparent;
    color: white;
    font-family: inherit;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: white;
    color: black;
}

.glitch {
    animation: glitch .12s infinite;
}

@keyframes pulse {
    from { opacity: .5; }
    to { opacity: 1; }
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(-5px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, -2px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div class="screen" id="scanScreen">

    <div class="small">SECURITY PROTOCOL</div>

    <div class="title">
        DEVICE SCAN
    </div>

    <div class="status" id="status">
        INITIALIZING...
    </div>

    <div class="percent" id="percent">
        0%
    </div>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>

</div>


<div class="screen warning" id="warning">

    <h1>⚠ ANOMALY<br>DETECTED</h1>

    <p id="warningText">
        UNKNOWN ACTIVITY FOUND
    </p>

</div>


<div class="screen prank" id="prank">

    <div class="small">
        SECURITY REPORT
    </div>

    <h1>😂 GOT YOU!</h1>

    <p>
        THIS WAS JUST A PRANK
    </p>

    <button onclick="location.reload()">
        RUN AGAIN
    </button>

</div>


<script>

const status = document.getElementById("status");
const percent = document.getElementById("percent");
const progress = document.getElementById("progress");

const scanScreen = document.getElementById("scanScreen");
const warning = document.getElementById("warning");
const prank = document.getElementById("prank");

let value = 0;

const messages = [
    "INITIALIZING...",
    "CHECKING SYSTEM...",
    "SCANNING FILE STRUCTURE...",
    "ANALYZING CONNECTION...",
    "VERIFYING SECURITY...",
    "SEARCHING FOR ANOMALIES...",
    "FINALIZING SCAN..."
];

let messageIndex = 0;

const scan = setInterval(() => {

    value += Math.floor(Math.random() * 5) + 1;

    if (value >= 100) {
        value = 100;
        clearInterval(scan);

        percent.textContent = "100%";
        progress.style.width = "100%";
        status.textContent = "SCAN COMPLETE";

        setTimeout(showWarning, 1200);

    } else {

        percent.textContent = value + "%";
        progress.style.width = value + "%";

        if (value > messageIndex * 14) {
            messageIndex = Math.min(messageIndex + 1, messages.length - 1);
            status.textContent = messages[messageIndex];
        }
    }

}, 350);


function showWarning() {

    scanScreen.style.display = "none";
    warning.style.display = "flex";

    setTimeout(() => {

        document.body.style.background = "#250000";

        document.getElementById("warningText").textContent =
            "UNUSUAL ACTIVITY DETECTED";

    }, 1800);

    setTimeout(() => {

        warning.classList.add("glitch");

    }, 3000);

    setTimeout(() => {

        warning.style.display = "none";
        prank.style.display = "flex";

        document.body.style.background = "#050505";

    }, 5000);
}

</script>

</body>
</html>
